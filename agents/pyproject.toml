[project]
name = "socratic-seminar-agents"
version = "0.1.0"
description = "LangGraph agents for Socratic Seminar"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=1.1.0",
    "langchain-openai>=0.2.0",
    "langgraph-cli>=0.1.0",
    "langgraph-cli[inmem]",
    "langchain-anthropic>=1.2.0",
    "deepagents",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    # Research agent dependencies
    "tavily-python>=0.5.0",
    "markdownify>=0.12.0",
    # Note: deepagents/ is a reference submodule, not a direct dependency.
    # Install separately if needed: pip install -e ../deepagents/libs/deepagents
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

