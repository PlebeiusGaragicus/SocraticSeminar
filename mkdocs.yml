site_name: Socratic Seminar
site_description: A self-hostable, project-based agentic document editor powered by Nostr authentication and Bitcoin eCash payments. Structured intellectual discourse through AI-assisted document editing.
site_url: https://plebeiusgaragicus.github.io/SocraticSeminar/
repo_url: https://github.com/PlebeiusGaragicus/SocraticSeminar
repo_name: SocraticSeminar

theme:
  name: material
  palette:
    - scheme: slate
      primary: orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Features:
    - Overview: features/overview.md
    - Frontend: features/frontend.md
    - Agents: features/agents.md
    - Backend: features/backend.md
    - Nostr: features/nostr.md
    - eCash: features/ecash.md
    - CopyFuck: features/copyfuck.md
    - templates: features/templates.md
    - debugging: features/debugging.md
    - testing: features/testing.md
  - How to argue:
    - How to argue: how-to-argue/index.md
    - arguments.py: how-to-argue/arguments.md
    - Arguments:
      - vibe coding: how-to-argue/arguments/vibe-coding.md
